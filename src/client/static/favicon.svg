<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Traincon">
  <title>Traincon</title>
  <!--
    Drawn for 16 px first: at tab size the gradient tile and the pale nose are
    all that survive, so the shapes are bold and there is no fine detail to
    turn to mush. The gradient matches the in-app logo.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4da3ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#g)"/>

  <!-- TGV nose in profile: a long raked front, a cab window, and the rail. -->
  <path d="M11 41c0-3 1.6-5.9 4.3-8.1L31 20.2c2.6-2.1 5.9-3.2 9.2-3.2H47a6 6 0 0 1 6 6v18a2 2 0 0 1-2 2H13a2 2 0 0 1-2-2Z"
        fill="#fff" fill-opacity=".96"/>
  <path d="M20.5 34.5 32 25.2c1.6-1.3 3.6-2 5.7-2H44v11.3Z"
        fill="url(#g)" fill-opacity=".55"/>

  <!-- Wheels, kept large enough to read as wheels when scaled down. -->
  <circle cx="23" cy="47" r="4.4" fill="#fff"/>
  <circle cx="43" cy="47" r="4.4" fill="#fff"/>

  <!-- Track. -->
  <rect x="6" y="52.6" width="52" height="3.2" rx="1.6" fill="#fff" fill-opacity=".85"/>
</svg>
