<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 80" class="sig" aria-hidden="true" focusable="false">
  <!-- Sémaphore: one red, and the œilleton lit on the mast. Stop, then pass
       at caution — the white light is what says it may be passed at all. -->
  <rect x="8" y="75" width="14" height="4" rx="1.5" fill="#4a525e"/>
  <rect x="13" y="46" width="4" height="30" fill="#5b6472"/>
  <circle cx="23.5" cy="53" r="3.6" fill="#f4f6fa" opacity=".22"/>
  <circle cx="23.5" cy="53" r="2.6" fill="#f4f6fa" stroke="#0b0d11" stroke-width=".7"/>
  <rect x="3" y="2" width="24" height="44" rx="5" fill="#14171d" stroke="#3a434f" stroke-width="1.4"/>
  <circle cx="15" cy="12" r="5" fill="#23282f" stroke="#0b0d11" stroke-width="1"/>
  <circle cx="15" cy="24" r="7" fill="#ef2f2f" opacity=".2"/>
  <circle cx="15" cy="24" r="5" fill="#ef2f2f" stroke="#0b0d11" stroke-width=".8"/>
  <circle cx="13.5" cy="22.5" r="1.5" fill="#fff" opacity=".5"/>
  <circle cx="15" cy="36" r="5" fill="#23282f" stroke="#0b0d11" stroke-width="1"/>
</svg>
