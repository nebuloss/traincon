<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 187 29">
  <!-- TGV remorque, 18.7 m. Articulated: the bogies are shared, so these sit
       closer together than a locomotive-hauled rake. -->
  <rect x="0" y="0" width="187" height="29" rx="3" fill="{{band}}"/>
  <rect x="4" y="4.5" width="179" height="20" rx="3" fill="{{body}}"/>
  <rect x="4" y="13.7" width="179" height="1.6" fill="#8d99a8" opacity=".55"/>
  <rect x="66" y="8.5" width="28" height="12" rx="2" fill="#b7c1cd"/>
  <rect x="118" y="9.5" width="18" height="10" rx="2" fill="#98a4b2"/>
  <!-- One door leaf per side, at the vehicle end. -->
  <rect x="16" y="0" width="9" height="29" fill="#101720" opacity=".34"/>
  <rect x="0" y="8" width="4" height="13" rx="1.5" fill="#101720" opacity=".5"/>
  <rect x="183" y="8" width="4" height="13" rx="1.5" fill="#101720" opacity=".5"/>
</svg>
