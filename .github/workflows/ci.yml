name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Runs against the bundled capture, so CI never depends on the upstream
      # SNCF feed being up — it goes down regularly.
      - run: npm run build
      - run: npm test

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go/go.sum

      # gofmt is not advisory: unformatted Go is a review distraction, and the
      # tool settles it rather than the reviewer.
      - name: Check the Go server
        working-directory: go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo 'run gofmt -w .'; exit 1; }
          go vet ./...
          go test ./...

      # Advisory: a style nit in the installer should surface, not block a
      # release. Correctness is covered by `sh -n` and the test suite.
      - name: Shellcheck the installer
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -s sh install.sh scripts/fetch-geo.sh
