name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm test

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go/go.sum

      # Static, so the container needs no Go toolchain and no shared libraries
      # — and CGO off is what makes it static on a glibc builder.
      - name: Build the Go server
        working-directory: go
        env:
          CGO_ENABLED: '0'
        run: |
          go test ./...
          go build -trimpath -ldflags='-s -w' -o ../traincon-linux-amd64 ./cmd/traincon

      - name: Package
        run: tar -czf traincon.tar.gz dist/ dist-server/ scripts/ fixtures/ tools/ package.json package-lock.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # The signal positions ride along with the release rather than being
          # rebuilt from someone else's tile server on every install. 160 kB,
          # and pinned to the version that was tested against it.
          files: |
            traincon.tar.gz
            traincon-linux-amd64
            data/geo/signals.json.gz
          generate_release_notes: true
